# Modified from https://github.com/actions/starter-workflows/blob/main/ci/dotnet-desktop.yml

name: Build artifacts

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:

jobs:
  build:
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        runtime: [ "win-x64", "osx-arm64", "linux-x64" ]
        include:
          - runtime: "win-x64"
            os: "windows-latest"
          - runtime: "osx-arm64"
            os: "macos-26"
          - runtime: "linux-x64"
            os: "ubuntu-latest"

    permissions:
      id-token: write
      contents: read
      attestations: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Test the application on Windows
      if: matrix.runtime == 'win-x64'
      run: |
        dotnet test tests/TuneLab.Tests/TuneLab.Tests.csproj --configuration Release
        dotnet test legacy/compat/TuneLab.Hosting.Compat.Legacy.Tests/TuneLab.Hosting.Compat.Legacy.Tests.csproj --configuration Release

    - name: Test the application on macOS
      if: matrix.runtime == 'osx-arm64'
      run: |
        dotnet test tests/TuneLab.Tests/TuneLab.Tests.csproj --configuration Release --filter "FullyQualifiedName!~SetupCliOptionsTests&FullyQualifiedName!~SetupInstallManifestTests&FullyQualifiedName!~SetupUninstallTests"
        dotnet test legacy/compat/TuneLab.Hosting.Compat.Legacy.Tests/TuneLab.Hosting.Compat.Legacy.Tests.csproj --configuration Release

    - name: Check out the VST3 SDK
      if: matrix.runtime == 'osx-arm64'
      run: git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"

    - name: Build the application (Windows and Linux)
      if: matrix.runtime != 'osx-arm64'
      run: dotnet publish TuneLab/TuneLab.csproj --configuration Release -r ${{ matrix.runtime }} --self-contained false

    # Publish macOS as an .app bundle, with the GUI apphost in Contents/MacOS and
    # the independent CLI and extension installer outputs in Contents/Helpers.
    - name: Build and package the macOS application
      if: matrix.runtime == 'osx-arm64'
      shell: bash
      run: |
        [[ "$(uname -m)" == arm64 ]] || { echo "macOS arm64 runner required" >&2; exit 1; }
        export TUNELAB_MACOS_MIN_VERSION=26.0
        # Homebrew otherwise links against the runner's current SDK target
        # (for example macOS 27), which would make the bundled codec unusable
        # on the macOS 26 minimum declared by the app bundle.
        export MACOSX_DEPLOYMENT_TARGET="$TUNELAB_MACOS_MIN_VERSION"
        brew install --build-from-source mpg123 lame
        MACOS_LAME_DYLIB="$(brew --prefix lame)/lib/libmp3lame.dylib" \
          VST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk" \
          bash CIUtils/package-macos.sh --configuration Release --runtime osx-arm64 --output-dir workspace

    - name: Move artifacts
      if: matrix.runtime != 'osx-arm64'
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: Move-Item -Path "TuneLab\bin\Release\net8.0\${{ matrix.runtime }}\publish" -Destination "workspace\"
    
    # 命令行与主程序同目录发布：外部工具与 agent 靠它驱动 TuneLab，不随包发就等于没有。
    # 单独发布一次（而不是指望上一步的解决方案发布把它摆在哪儿），故这条路径是确定的。
    - name: Publish the command line into artifacts
      if: matrix.runtime != 'osx-arm64'
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        dotnet publish TuneLab.Cli/TuneLab.Cli.csproj --configuration Release -r ${{ matrix.runtime }}
        Copy-Item "TuneLab.Cli/bin/Release/net8.0/${{ matrix.runtime }}/publish/*" -Destination "workspace/" -Recurse -Force

    - name: Copy license to artifacts path
      if: matrix.runtime != 'osx-arm64'
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: Copy-Item "LICENSE.txt" -Destination "workspace\"

    - name: Generate artifact attestation - Windows
      if: runner.os == 'Windows' && github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: '"workspace/*.dll","workspace/*.exe"'
    
    - name: Attest macOS application archive
      if: matrix.runtime == 'osx-arm64' && github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: 'workspace/*.zip'

    - name: Find executable and dynamic library files - Linux
      if: matrix.runtime == 'linux-x64' && github.event_name != 'pull_request'
      id: find-executable-files
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        find ./CIUtils/ -name "*.sh" -exec chmod +x {} \;
        EXEC_FILES=$(./CIUtils/find-executable.sh "workspace/")
        echo "Found executable and dynamic library files: $EXEC_FILES"
        echo "exec_files=$EXEC_FILES" >> $GITHUB_OUTPUT

    - name: Generate artifact attestation - Linux
      if: matrix.runtime == 'linux-x64' && github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: '"workspace/*.dll",${{ steps.find-executable-files.outputs.exec_files }}'

    - name: Get short SHA
      uses: benjlevesque/short-sha@v3.0
      id: short-sha
      with:
        length: 7

    - name: Upload artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: TuneLab-${{ matrix.runtime }}-${{ steps.short-sha.outputs.sha }}
        path: workspace

    - name: Upload artifacts (Not signed)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: TuneLab-${{ matrix.runtime }}-${{ steps.short-sha.outputs.sha }}-Unsafe
        path: workspace

